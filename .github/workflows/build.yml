name: Build Fablewood APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Lock in Permanent Android Signing Key
        run: |
          mkdir -p ~/.android
          if [ ! -f "app/fablewood-debug.keystore" ]; then
            echo "Generating permanent Fablewood signing key for the first time..."
            keytool -genkeypair -v \
              -keystore app/fablewood-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/fablewood-debug.keystore
            git commit -m "chore: save permanent Android signing keystore [skip ci]" || true
            git push || true
          fi
          cp app/fablewood-debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload Fablewood APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fablewood-debug-apk
          path: app/build/outputs/apk/debug/*.apk